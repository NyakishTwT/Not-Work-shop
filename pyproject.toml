[project]
name = "testdocker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
